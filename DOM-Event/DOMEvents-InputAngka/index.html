<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input Angka</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <h1>Praktik DOM & Events</h1>

    <!-- Input -->
    <input 
      type="number" 
      id="angka"
      placeholder="Masukkan angka..."
    >

    <!-- Button -->
    <button id="btn">
      Tampilkan
    </button>

    <!-- Hasil -->
    <div id="hasil" class="hidden"></div>

  </div>

  <script src="script.js"></script>
</body>
</html>
